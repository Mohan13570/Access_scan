<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AccessScan Assistant</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAFAF8;
      color: #1C1917;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #B45309;
    }
    .badge {
      background: #B45309;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      background: #1C1917;
      color: #FAFAF8;
      font-weight: bold;
      border: 1px solid #1C1917;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #000; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">♿</span>
    <h3 style="margin: 0; font-size: 16px;">AccessScan</h3>
    <span class="badge">v1.2.0</span>
  </div>
  <p style="font-size: 12px; color: #57534E;">Single-Switch scanning is active. Press <strong>Spacebar</strong> to activate any highlighted control.</p>
  <button id="toggleBtn" class="btn">Pause / Resume (P)</button>
  <script src="popup.js"></script>
</body>
</html>
