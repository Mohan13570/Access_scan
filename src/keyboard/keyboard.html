<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessScan Keyboard</title>
  <link rel="stylesheet" href="keyboard.css" />
</head>
<body>
  <div id="osk-root" role="application" aria-label="AccessScan virtual keyboard">

    <div id="osk-header">
      <div id="osk-title">⌨ AccessScan Keyboard</div>
      <div id="osk-field-label" aria-label="Field being edited"></div>
      <div id="osk-preview" aria-live="polite" aria-label="Text entered"></div>
    </div>

    <div id="osk-layout-bar" role="toolbar" aria-label="Keyboard layout">
      <button data-layout="qwerty" class="layout-btn" aria-label="Letters keyboard">ABC</button>
      <button data-layout="numeric" class="layout-btn" aria-label="Number keyboard">123</button>
      <button data-layout="email" class="layout-btn" aria-label="Email keyboard">@</button>
      <span id="osk-row-indicator" aria-live="polite"></span>
    </div>

    <div id="osk-keys" role="group" aria-label="Keyboard keys"></div>

    <div id="osk-nav-hint" aria-hidden="true">
      ◀ Prev key &nbsp;|&nbsp; ▶ Next key &nbsp;|&nbsp; ▼ Type key &nbsp;|&nbsp; ▲ Exit to webpage
    </div>

    <div id="osk-announce" aria-live="assertive" aria-atomic="true" class="sr-only"></div>
  </div>

  <script src="keyboard.js"></script>
</body>
</html>
