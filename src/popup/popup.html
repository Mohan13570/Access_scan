<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessScan Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="popup-root">

    <!-- Header -->
    <header>
      <div id="logo">
        <span id="logo-icon" aria-hidden="true">♿</span>
        <div>
          <h1>AccessScan</h1>
          <p id="tagline">Universal Single-Switch Navigator</p>
        </div>
      </div>
    </header>

    <!-- Toggle -->
    <section id="main-toggle-section">
      <div id="status-row">
        <span id="status-label">Scanner</span>
        <label class="toggle-switch" aria-label="Enable or disable AccessScan">
          <input type="checkbox" id="toggle-enabled" />
          <span class="slider"></span>
        </label>
        <span id="status-text">Off</span>
      </div>
    </section>

    <hr />

    <!-- Scan Settings -->
    <section aria-labelledby="scan-heading">
      <h2 id="scan-heading">Scan Settings</h2>

      <label for="scan-mode">Mode</label>
      <select id="scan-mode" aria-describedby="scan-mode-desc">
        <option value="flat">Flat — scan all elements sequentially</option>
        <option value="hierarchical">Hierarchical — scan sections first</option>
      </select>
      <p id="scan-mode-desc" class="hint">
        Hierarchical is faster on complex pages.
      </p>

      <label for="scan-interval">Scan speed: <strong id="interval-display">1500</strong> ms</label>
      <input
        type="range"
        id="scan-interval"
        min="400"
        max="5000"
        step="100"
        value="1500"
        aria-valuemin="400"
        aria-valuemax="5000"
        aria-valuenow="1500"
        aria-label="Scan interval in milliseconds"
      />
      <div class="range-labels"><span>Fast (0.4s)</span><span>Slow (5s)</span></div>
    </section>

    <hr />

    <!-- Switch Key -->
    <section aria-labelledby="key-heading">
      <h2 id="key-heading">Switch Key</h2>

      <label for="switch-key">Activation key</label>
      <div id="key-capture-row">
        <input
          type="text"
          id="switch-key"
          value="Space"
          readonly
          aria-label="Press to set activation key"
          placeholder="Press any key…"
        />
        <button id="btn-capture-key" aria-label="Click then press a key to set the switch key">
          Change
        </button>
      </div>
      <p class="hint">Press the physical switch key or Space bar.</p>

      <label for="pause-key">Pause / Resume key</label>
      <select id="pause-key" aria-label="Select pause key">
        <option value="Escape">Escape</option>
        <option value="F1">F1</option>
        <option value="F2">F2</option>
        <option value="Pause">Pause/Break</option>
      </select>
    </section>

    <hr />

    <!-- Visual -->
    <section aria-labelledby="visual-heading">
      <h2 id="visual-heading">Visual Highlight</h2>
      <div id="color-row">
        <label for="highlight-color">Colour</label>
        <input type="color" id="highlight-color" value="#FF6B35" aria-label="Highlight colour" />
        <label for="border-width">Border</label>
        <select id="border-width" aria-label="Border width">
          <option value="2">Thin (2px)</option>
          <option value="3" selected>Medium (3px)</option>
          <option value="5">Thick (5px)</option>
        </select>
      </div>
    </section>

    <hr />

    <!-- Audio -->
    <section aria-labelledby="audio-heading">
      <h2 id="audio-heading">Audio Feedback</h2>
      <label class="checkbox-label">
        <input type="checkbox" id="audio-enabled" checked />
        Enable audio cues
      </label>
    </section>

    <hr />

    <!-- Actions -->
    <section id="actions">
      <button id="btn-save" class="btn-primary">💾 Save Settings</button>
      <button id="btn-reset" class="btn-secondary">↺ Reset Defaults</button>
    </section>

    <footer>
      <p>v1.0.0 &nbsp;·&nbsp; Hackathon Edition &nbsp;·&nbsp; Accessibility Track ♿</p>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
